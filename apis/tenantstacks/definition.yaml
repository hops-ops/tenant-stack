apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: tenantstacks.hops.ops.com.ai
spec:
  group: hops.ops.com.ai
  names:
    kind: TenantStack
    plural: tenantstacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: TenantStack installs the Capsule multi-tenancy controller on a target Kubernetes cluster as a Helm release. Cloud-neutral. Engine-only in this iteration — Tenant/Org claim XRDs, capsule-proxy, isolation tier enum, lifecycle states, CVE hardening (RBAC + Kyverno guard) and cross-stack (policy / observe / istio) integrations ship in subsequent iterations.
        type: object
        properties:
          spec:
            description: TenantStackSpec defines the desired state.
            type: object
            properties:
              clusterName:
                description: Name of the target cluster. Used as default for helmProviderConfigRef.name, kubernetesProviderConfigRef.name, and resource naming.
                type: string
              managementPolicies:
                description: Management policies for all composed resources. Defaults to ["*"].
                type: array
                items:
                  type: string
                default:
                - "*"
              labels:
                description: Custom labels applied to all managed resources. Merged with the stack defaults (hops.ops.com.ai/managed=true, hops.ops.com.ai/tenantstack=<name>).
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              helmProviderConfigRef:
                description: Reference to the Helm ProviderConfig. Defaults to clusterName.
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              kubernetesProviderConfigRef:
                description: Reference to the Kubernetes ProviderConfig (used to compose the capsule namespace). Defaults to clusterName.
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              capsule:
                description: Capsule multi-tenancy configuration — controller + (optional) proxy. Capsule is the standard production multi-tenancy framework for Kubernetes (Tenant CRD + admission webhook). The upstream chart bundles `capsule-proxy` as an optional subchart; this XRD installs it as a separate top-level Helm Release (cleaner lifecycle, independent of the controller's chart version). CVE-class hardening (RBAC + Kyverno guard) is tracked separately under tasks/tenant-stack-cve-hardening.
                type: object
                properties:
                  enabled:
                    description: Whether to install Capsule. Defaults to true.
                    type: boolean
                    default: true
                  namespace:
                    description: Namespace for the Capsule Helm release. Defaults to "capsule-system".
                    type: string
                  releaseName:
                    description: Helm release name. Defaults to "capsule".
                    type: string
                  chartVersion:
                    description: Capsule Helm chart version. Default 0.12.4 (app v0.12.4). Pinned minimum is ≥ v0.12.x — the webhook refactor that closes the CVE-2024-39690 / CVE-2025-55205 namespace-label injection CVE class. Pre-0.12 versions MUST NOT be used.
                    type: string
                  values:
                    description: Helm values merged on top of the stack's defaults.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    description: Helm values that replace all defaults entirely.
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  proxy:
                    description: |
                      capsule-proxy install — the per-tenant filtered list/watch
                      proxy that sits in front of the kube-apiserver. Tenant
                      kubectl users target the proxy URL instead of the apiserver
                      directly; the proxy extracts identity from a Bearer JWT
                      (via `usernameClaim`) and filters list/watch responses to
                      only the namespaces the user is a Tenant owner of.
                      capsule-proxy itself does NOT validate JWTs — that
                      happens upstream (EKS apiserver OIDC IdP association OR
                      oauth2-proxy in front of capsule-proxy). When `spec.auth.enabled`
                      is true, a Zitadel OIDC Application is auto-provisioned
                      for tenant kubectl users (`kubectl oidc-login`).
                    type: object
                    properties:
                      enabled:
                        description: Whether to install capsule-proxy. Defaults to false (off in the first pass; flip to true to opt in).
                        type: boolean
                        default: false
                      releaseName:
                        description: Helm release name. Defaults to "capsule-proxy".
                        type: string
                      chartVersion:
                        description: capsule-proxy Helm chart version. Default 0.10.0 — the version pinned by capsule chart 0.12.4 as its subchart dependency.
                        type: string
                      usernameClaim:
                        description: |
                          JWT claim capsule-proxy uses as the username.
                          Defaults to "sub" — universal across grant
                          types. Zitadel's interactive flow emits
                          `preferred_username` (human userName); the
                          machine-user JWT-bearer flow does not, but
                          both emit `sub`. Use "preferred_username" if
                          you only support human users and want
                          human-readable usernames.
                        type: string
                      replicas:
                        description: Replica count. Defaults to 1. Set ≥2 with leaderElection in values for HA.
                        type: integer
                        minimum: 1
                      values:
                        description: Helm values merged on top of the stack's defaults.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      overrideAllValues:
                        description: Helm values that replace all defaults entirely.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
              aws:
                description: |
                  AWS integration. Couples this stack to AWS EKS, but stays
                  opt-in — turn off by leaving spec.aws.eksIdentityProvider.enabled
                  unset / false and the stack is cloud-neutral.

                  When enabled, composes an EKS IdentityProviderConfig MR
                  that wires the kube-apiserver to trust JWTs issued by the
                  Zitadel issuer URL specified in spec.auth.issuerURL. This
                  closes the loop for capsule-proxy — without it the
                  apiserver rejects tenant Bearer JWTs as unauthenticated
                  even though capsule-proxy itself processes them.

                  Requires spec.auth.enabled (the Zitadel Oidc Application
                  emits the client_id this IdP config registers); the
                  composition gates the IdP MR rendering on the Oidc
                  Application's connection secret being populated.
                type: object
                properties:
                  region:
                    description: AWS region of the EKS cluster. Required when eksIdentityProvider.enabled.
                    type: string
                  awsProviderConfigRef:
                    description: Reference to the AWS ProviderConfig. Defaults to "default".
                    type: object
                    properties:
                      name:
                        type: string
                      kind:
                        type: string
                        enum:
                        - ProviderConfig
                        - ClusterProviderConfig
                  eksIdentityProvider:
                    description: |
                      EKS IdentityProviderConfig (`aws eks
                      associate-identity-provider-config`). Tells the EKS
                      apiserver to validate Bearer JWTs against the AuthStack
                      Zitadel issuer URL, mapping JWT claims to k8s user +
                      groups. Required for capsule-proxy to actually
                      function end-to-end on EKS.
                    type: object
                    properties:
                      enabled:
                        description: Whether to compose the EKS IdentityProviderConfig. Defaults to false. Requires spec.auth.enabled.
                        type: boolean
                        default: false
                      identityProviderConfigName:
                        description: The name AWS gives this IdP association within the EKS cluster. Defaults to "zitadel". Each EKS cluster can host multiple IdP configs; the name must be unique within the cluster.
                        type: string
                      eksClusterName:
                        description: Name of the EKS cluster to associate the IdP config with. Defaults to spec.clusterName.
                        type: string
                      usernameClaim:
                        description: |
                          JWT claim the apiserver reads as the
                          username. Defaults to spec.capsule.proxy.usernameClaim
                          (which defaults to "sub" — universal across
                          Zitadel grant types). Keep the two aligned —
                          capsule-proxy extracts identity from the JWT
                          for list/watch filtering and the apiserver
                          validates it via OIDC; they must agree on
                          which claim is the username.
                        type: string
                      groupsClaim:
                        description: JWT claim the apiserver reads as group membership. Defaults to "groups".
                        type: string
                      usernamePrefix:
                        description: Optional prefix prepended to OIDC-issued usernames (e.g. "zitadel:"). Empty by default — usernames pass through unchanged.
                        type: string
                      groupsPrefix:
                        description: Optional prefix prepended to OIDC-issued groups. Empty by default.
                        type: string
                      requiredClaims:
                        description: Optional map of JWT claim → required value. AWS rejects tokens that don't satisfy every entry.
                        type: object
                        additionalProperties:
                          type: string
              auth:
                description: |
                  Cross-stack AuthStack integration. When `enabled: true`,
                  TenantStack composes a Zitadel ProviderConfig + Oidc
                  Application MR for tenant kubectl users
                  (`kubectl oidc-login`). The resulting client_id lands in a
                  Crossplane connection Secret tenants pull from to build
                  their kubeconfig.

                  Prerequisites:
                  1. AuthStack must be installed and Ready (this is what
                     publishes the OIDC issuer at spec.auth.issuerURL).
                  2. A K8s Secret named `zitadel-credentials` must exist in
                     the TenantStack's namespace ON THE CROSSPLANE CLUSTER
                     (the cluster where the Zitadel provider's controllers
                     run, not necessarily the workload cluster), containing
                     a single key `credentials` with the provider creds JSON
                     ({access_token, domain, port, insecure}). For the hops
                     colima+pat-local topology run
                     `hops auth zitadel-credentials sync` (or copy from
                     AuthStack's iam-admin-pat Secret manually).
                  3. The Zitadel Project under which to provision OIDC apps
                     must already exist; capture its ID via the Zitadel
                     management API or UI and pass via spec.auth.zitadelProjectId.

                  The cross-cluster ExternalSecret auto-composition is NOT
                  shipped — Crossplane provider-kubernetes Object MRs are
                  bound to a single ProviderConfig context, so the ESO →
                  workload-cluster → control-plane-cluster sync cannot be
                  modeled as a single composition step. Tracked as a future
                  iteration if ESO lands on the control-plane cluster.
                type: object
                properties:
                  enabled:
                    description: Whether to compose the Zitadel OIDC integration. Defaults to false.
                    type: boolean
                    default: false
                  issuerURL:
                    description: Zitadel OIDC issuer URL. Copy from AuthStack status.oidc.issuerURL. Example "https://auth.ops.com.ai". Surfaced in status for tenant kubeconfig snippets.
                    type: string
                  zitadelProjectId:
                    description: Zitadel Project ID under which to provision the OIDC Application. Capture from the Zitadel UI ("Projects → <your project> → details"), or compose a Project MR out-of-band and pass its ID here. Required when auth.enabled.
                    type: string
                  oidcClient:
                    description: OIDC Application shape provisioned in Zitadel for tenant kubectl users (`kubectl oidc-login`).
                    type: object
                    properties:
                      name:
                        description: Display name of the OIDC Application in Zitadel. Defaults to "capsule-proxy".
                        type: string
                      redirectUris:
                        description: Allowed redirect URIs. kubectl oidc-login defaults to http://localhost:8000 and http://localhost:18000.
                        type: array
                        items:
                          type: string
                      postLogoutRedirectUris:
                        description: Allowed post-logout redirect URIs. Optional.
                        type: array
                        items:
                          type: string
            required:
            - clusterName
          status:
            description: TenantStackStatus defines the observed state.
            type: object
            properties:
              ready:
                description: Overall readiness — true when all enabled components are Ready.
                type: boolean
              capsule:
                type: object
                properties:
                  ready:
                    type: boolean
                  proxy:
                    type: object
                    properties:
                      ready:
                        type: boolean
              aws:
                type: object
                properties:
                  eksIdentityProvider:
                    type: object
                    properties:
                      ready:
                        type: boolean
                      identityProviderConfigName:
                        description: Name of the IdP config as known to AWS. Mirrors spec.aws.eksIdentityProvider.identityProviderConfigName for downstream readability.
                        type: string
              auth:
                type: object
                properties:
                  ready:
                    type: boolean
                  oidcClientSecretRef:
                    description: Reference to the K8s Secret holding the composed OIDC application's client_id (key "client_id") and client_secret (key "client_secret"). Capsule-proxy itself doesn't read these; emitted for tenant kubectl users to construct their kubeconfig (`kubectl oidc-login --oidc-client-id=$(kubectl get secret ... -o jsonpath='{.data.client_id}' | base64 -d)`).
                    type: object
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
        required:
        - spec

apiVersion: meta.dev.upbound.io/v2alpha1
kind: Project
metadata:
  name: tenant-stack
spec:
  dependsOn:
  - apiVersion: pkg.crossplane.io/v1
    kind: Function
    package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready
    version: '>=v0.7.0'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-helm
    version: '>=v1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes
    version: '>=v1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-upjet-zitadel
    version: '>=v0.1.1'
  - apiVersion: pkg.crossplane.io/v1
    kind: Provider
    package: xpkg.crossplane.io/crossplane-contrib/provider-aws-eks
    version: '>=v2'
  description: Tenant stack — Capsule (Kubernetes multi-tenancy) engine install. Cloud-neutral.
    First pass ships the Capsule controller helm release only; Tenant/Org claim XRDs,
    capsule-proxy, isolation tier enum, lifecycle states, CVE hardening and cross-stack
    (policy / observe / istio) integrations land in subsequent iterations.
  license: Apache-2.0
  maintainer: Patrick Lee Scott <pat@patscott.io>
  readme: |
    # tenant-stack

    Installs the Capsule multi-tenancy controller on a target Kubernetes
    cluster. Cloud-neutral. Engine-only first pass — Tenant/Org claim XRDs
    and cross-stack integrations land in subsequent iterations.
  repository: ghcr.io/hops-ops/tenant-stack
  source: github.com/hops-ops/tenant-stack
